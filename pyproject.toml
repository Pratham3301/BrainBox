[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "neural-archaeology"
version = "0.1.0"
description = "A research-grade platform for neural network reverse-engineering and mechanistic interpretability."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "scikit-learn>=1.3.0",
    "pandas>=2.1.0",
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "pydantic>=2.5.0",
    "plotly>=5.18.0",
    "tqdm>=4.66.0",
    "pyyaml>=6.0.1",
    "safetensors>=0.4.2",
    "sentencepiece>=0.2.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.1.14",
    "mypy>=1.8.0"
]

[tool.hatch.build.targets.wheel]
packages = ["src/neural_archaeology"]

[tool.pyright]
extraPaths = ["."]
